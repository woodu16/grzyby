<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nie zbieromy w niedziela grzybów</title>

    <!-- Meta Tagi Open Graph dla ładnego podglądu na WhatsApp -->
    <meta property="og:title" content="Nie zbieromy w niedziela grzybów" />
    <meta property="og:description" content="Koszyki gotowe, nożyki spakowane? Sprawdź, ile czasu zostało do porannego wyjścia do lasu!" />
    <meta property="og:url" content="https://github.io" />
    <meta property="og:type" content="website" />

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
            position: relative;
            
            /* Statyczne tło - prawdziwy las na Kaszubach */
            background-image: url('https://studiodruku.com.pl');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Przyciemniająca nakładka na zdjęcie, aby napisy i kafelki były idealnie czytelne */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* Zawartość strony wyciągnięta nad nakładkę i mgłę */
        .content-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- EFEKT LEŚNEJ MGŁY --- */
        .fog-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            overflow: hidden;
            opacity: 0.35;
            pointer-events: none;
        }

        .fog-layer {
            position: absolute;
            bottom: -50px;
            left: 0;
            width: 200%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 90%, rgba(255, 255, 255, 0.2) 0%, transparent 60%);
            filter: blur(25px);
            animation: moveFog 40s linear infinite;
        }

        @keyframes moveFog {
            0% { transform: translateX(0%) translateY(0px); }
            50% { transform: translateX(-25%) translateY(10px); }
            100% { transform: translateX(0%) translateY(0px); }
        }

        /* --- STYLIZACJA ELEMENTÓW --- */
        h1 {
            font-size: 2.8rem;
            margin: 0 0 10px 0;
            color: #a3e635;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.95);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #f1f5f9;
            max-width: 550px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
            line-height: 1.5;
        }

        #countdown {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.8); /* Ciemniejsze tło kafelków dla idealnego kontrastu */
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            min-width: 95px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(163, 230, 53, 0.3);
        }

        .number {
            font-size: 3.2rem;
            font-weight: bold;
            color: #ffffff;
            display: block;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .label {
            font-size: 0.85rem;
            color: #a3e635;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 6px;
            font-weight: 700;
        }

        #message {
            font-size: 2.5rem;
            font-weight: bold;
            color: #a3e635;
            margin-top: 20px;
            display: none;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
        }
    </style>
</head>
<body>

    <!-- Filtry wizualne w tle -->
    <div class="overlay"></div>
    <div class="fog-wrapper">
        <div class="fog-layer"></div>
    </div>

    <!-- Główna zawartość strony -->
    <div class="content-wrapper">
        <h1>Nie zbieromy w niedziela grzybów</h1>
        <div class="subtitle">Odliczamy do porannego wyjścia do lasu. Koszyki gotowe, nożyki spakowane! 🌲🍄</div>

        <div id="countdown">
            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">Dni</span>
            </div>
            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">Godzin</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">Minut</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">Sekund</span>
            </div>
        </div>

        <div id="message">Czas ruszać do lasu! 🪓🧺</div>
    </div>

    <script>
        // Cel: 12 września 2027, godzina 08:00:00
        const targetDate = new Date("September 12, 2027 08:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (difference < 0) {
                clearInterval(timer);
                document.getElementById("countdown").style.display = "none";
                document.getElementById("message").style.display = "block";
            }
        }, 1000);
    </script>
</body>
</html>
