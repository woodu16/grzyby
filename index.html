<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nie zbieromy w niedziela grzybów</title>

    <!-- Meta Tagi Open Graph dla ładnego podglądu na WhatsApp -->
    <meta property="og:title" content="Nie zbieromy w niedziela grzybów" />
    <meta property="og:description" content="Koszyki gotowe, nożyki spakowane? Sprawdź, ile czasu zostało do porannego wyjścia do lasu!" />
    <meta property="og:url" content="https://github.io" />
    <meta property="og:type" content="website" />

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
            position: relative;
            /* Głębokie, leśne tło gradientowe */
            background: linear-gradient(to bottom, #0f1f15, #1b3324, #0f1f15);
        }

        /* Generowanie stałego, leśnego krajobrazu za pomocą CSS */
        .forest-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.35;
            background-image: 
                /* Sylwetki drzew na pierwszym planie */
                linear-gradient(90deg, transparent 40%, #050a06 40%, #050a06 43%, transparent 43%),
                linear-gradient(90deg, transparent 15%, #08120a 15%, #08120a 19%, transparent 19%),
                linear-gradient(90deg, transparent 70%, #060d07 70%, #060d07 75%, transparent 75%),
                /* Mgła na dole */
                linear-gradient(to top, rgba(15, 31, 21, 0.9), transparent 50%);
            background-size: 400px 100%, 300px 100%, 500px 100%, 100% 100%;
        }

        /* Dodatkowy efekt świetlny (leśna polana) */
        .forest-light {
            position: absolute;
            top: -20%;
            left: 25%;
            width: 50%;
            height: 80%;
            background: radial-gradient(circle, rgba(163, 230, 53, 0.08) 0%, transparent 70%);
            z-index: -1;
            transform: rotate(-15deg);
        }

        h1 {
            font-size: 2.8rem;
            margin: 0 0 10px 0;
            color: #a3e635;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
            font-weight: 800;
        }

        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #cbd5e1;
            max-width: 600px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.9);
            line-height: 1.5;
        }

        #countdown {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 14px;
            min-width: 95px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(163, 230, 53, 0.2);
            transition: transform 0.3s ease;
        }

        .number {
            font-size: 3.2rem;
            font-weight: bold;
            color: #ffffff;
            display: block;
            font-variant-numeric: tabular-nums;
        }

        .label {
            font-size: 0.85rem;
            color: #a3e635;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 8px;
            font-weight: 600;
        }

        #message {
            font-size: 2.5rem;
            font-weight: bold;
            color: #a3e635;
            margin-top: 20px;
            display: none;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- Stabilne, leśne elementy tła w CSS -->
    <div class="forest-bg"></div>
    <div class="forest-light"></div>

    <h1>Nie zbieromy w niedziela grzybów</h1>
    <div class="subtitle">Odliczamy do porannego wyjścia do lasu. Koszyki gotowe, nożyki spakowane! 🌲🍄</div>

    <div id="countdown">
        <div class="time-box">
            <span class="number" id="days">00</span>
            <span class="label">Dni</span>
        </div>
        <div class="time-box">
            <span class="number" id="hours">00</span>
            <span class="label">Godzin</span>
        </div>
        <div class="time-box">
            <span class="number" id="minutes">00</span>
            <span class="label">Minut</span>
        </div>
        <div class="time-box">
            <span class="number" id="seconds">00</span>
            <span class="label">Sekund</span>
        </div>
    </div>

    <div id="message">Czas ruszać do lasu! 🪓🧺</div>

    <script>
        // Cel: 12 września 2027, godzina 08:00:00
        const targetDate = new Date("September 12, 2027 08:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (difference < 0) {
                clearInterval(timer);
                document.getElementById("countdown").style.display = "none";
                document.getElementById("message").style.display = "block";
            }
        }, 1000);
    </script>
</body>
</html>
