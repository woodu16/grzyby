<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odliczanie do Grzybobrania</title>

    <!-- Meta Tagi Open Graph dla ładnego podglądu na WhatsApp -->
    <meta property="og:title" content="Odliczanie do Grzybobrania!" />
    <meta property="og:description" content="Koszyki gotowe, nożyki spakowane? Sprawdź, ile czasu zostało do porannego wyjścia do lasu!" />
    <meta property="og:image" content="https://github.io" /> <!-- Możesz zmienić na własny obrazek -->
    <meta property="og:url" content="https://github.io" />
    <meta property="og:type" content="website" />

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2e4a3b, #15231a);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #a3e635;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #cbd5e1;
        }

        #countdown {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            min-width: 90px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .number {
            font-size: 3rem;
            font-weight: bold;
            color: #ffffff;
            display: block;
        }

        .label {
            font-size: 0.9rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        #message {
            font-size: 2rem;
            font-weight: bold;
            color: #a3e635;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Leśna wyprawa</h1>
    <div class="subtitle">Odliczamy do porannego wyjścia do lasu. Koszyki gotowe, nożyki spakowane! 🌲🍄</div>

    <div id="countdown">
        <div class="time-box">
            <span class="number" id="days">00</span>
            <span class="label">Dni</span>
        </div>
        <div class="time-box">
            <span class="number" id="hours">00</span>
            <span class="label">Godzin</span>
        </div>
        <div class="time-box">
            <span class="number" id="minutes">00</span>
            <span class="label">Minut</span>
        </div>
        <div class="time-box">
            <span class="number" id="seconds">00</span>
            <span class="label">Sekund</span>
        </div>
    </div>

    <div id="message">Czas ruszać do lasu! 🪓🧺</div>

    <script>
        // Ustawienie docelowej daty: 12 września 2027, godzina 08:00:00
        const targetDate = new Date("September 12, 2027 08:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            // Obliczenia dla dni, godzin, minut i sekund
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // Wyświetlanie wyników z dodaniem zera z przodu (np. "05" zamiast "5")
            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            // Gdy odliczanie dobiegnie końca
            if (difference < 0) {
                clearInterval(timer);
                document.getElementById("countdown").style.display = "none";
                document.getElementById("message").style.display = "block";
            }
        }, 1000);
    </script>

</body>
</html>
