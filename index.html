<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nie zbieromy w niedziela grzybów</title>

    <!-- Meta Tagi Open Graph dla ładnego podglądu na WhatsApp -->
    <meta property="og:title" content="Nie zbieromy w niedziela grzybów" />
    <meta property="og:description" content="Koszyki gotowe, nożyki spakowane? Sprawdź, ile czasu zostało do porannego wyjścia do lasu!" />
    <meta property="og:image" content="https://unsplash.com" />
    <meta property="og:url" content="https://github.io" />
    <meta property="og:type" content="website" />

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* Stylizacja tła i pokazu slajdów */
        .bg-slider {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            transition: opacity 1.5s ease-in-out;
            opacity: 0;
        }

        .bg-slider.active {
            opacity: 1;
        }

        /* Przyciemniająca nakładka, aby napisy były czytelne */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: -1;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            color: #a3e635;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }

        .subtitle {
            font-size: 1.3rem;
            margin-bottom: 40px;
            color: #e2e8f0;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }

        #countdown {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .time-box {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            padding: 20px;
            border-radius: 12px;
            min-width: 90px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .number {
            font-size: 3rem;
            font-weight: bold;
            color: #ffffff;
            display: block;
        }

        .label {
            font-size: 0.9rem;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        #message {
            font-size: 2.5rem;
            font-weight: bold;
            color: #a3e635;
            margin-top: 20px;
            display: none;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- Kontenery na zmieniające się zdjęcia tła -->
    <div class="bg-slider active" style="background-image: url('https://unsplash.com');"></div>
    <div class="bg-slider" style="background-image: url('https://unsplash.com');"></div>
    <div class="bg-slider" style="background-image: url('https://unsplash.com');"></div>
    <div class="bg-slider" style="background-image: url('https://unsplash.com');"></div>
    
    <div class="overlay"></div>

    <h1>Nie zbieromy w niedziela grzybów</h1>
    <div class="subtitle">Odliczamy do porannego wyjścia do lasu. Koszyki gotowe, nożyki spakowane! 🌲🍄</div>

    <div id="countdown">
        <div class="time-box">
            <span class="number" id="days">00</span>
            <span class="label">Dni</span>
        </div>
        <div class="time-box">
            <span class="number" id="hours">00</span>
            <span class="label">Godzin</span>
        </div>
        <div class="time-box">
            <span class="number" id="minutes">00</span>
            <span class="label">Minut</span>
        </div>
        <div class="time-box">
            <span class="number" id="seconds">00</span>
            <span class="label">Sekund</span>
        </div>
    </div>

    <div id="message">Czas ruszać do lasu! 🪓🧺</div>

    <script>
        // --- Skrypt zmieniającego się tła (pokaz slajdów) ---
        const slides = document.querySelectorAll('.bg-slider');
        let currentSlide = 0;

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }
        // Zmiana zdjęcia co 7000 ms (7 sekund)
        setInterval(nextSlide, 7000);


        // --- Skrypt odliczania ---
        // Cel: 12 września 2027, godzina 08:00:00
        const targetDate = new Date("September 12, 2027 08:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (difference < 0) {
                clearInterval(timer);
                document.getElementById("countdown").style.display = "none";
                document.getElementById("message").style.display = "block";
            }
        }, 1000);
    </script>

</body>
</html>
