<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Odliczanie do grzybobrania</title>

  <style>
    :root {
      --cream: #f6edda;
      --moss: #263b24;
      --mushroom: #c56f39;
      --bark: #3a2618;
      --shadow: rgba(17, 24, 12, 0.58);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--cream);
      overflow-x: hidden;
      background: #172315;
    }

    .background {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 1.2s ease-in-out, transform 8s ease;
      transform: scale(1.04);
      z-index: -3;
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 214, 143, 0.22), transparent 28%),
        linear-gradient(120deg, rgba(19, 35, 17, 0.84), rgba(61, 35, 19, 0.56)),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.7));
      z-index: -2;
    }

    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.18) 1px, transparent 0);
      background-size: 18px 18px;
      z-index: -1;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 18px;
    }

    .card {
      width: min(920px, 100%);
      padding: clamp(28px, 6vw, 64px);
      border: 1px solid rgba(246, 237, 218, 0.26);
      border-radius: 34px;
      background:
        linear-gradient(145deg, rgba(38, 59, 36, 0.82), rgba(58, 38, 24, 0.68));
      box-shadow:
        0 30px 90px var(--shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(12px);
      text-align: center;
      animation: riseIn 900ms ease both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding: 9px 16px;
      border-radius: 999px;
      background: rgba(246, 237, 218, 0.14);
      color: #ffe4ad;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mushroom);
      box-shadow: 0 0 18px rgba(197, 111, 57, 0.8);
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 9vw, 104px);
      line-height: 0.92;
      letter-spacing: -0.06em;
      color: #fff4d6;
      text-shadow: 0 10px 40px rgba(0, 0, 0, 0.42);
    }

    .subtitle {
      max-width: 620px;
      margin: 24px auto 38px;
      font-size: clamp(18px, 2.6vw, 25px);
      line-height: 1.45;
      color: rgba(246, 237, 218, 0.9);
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(10px, 2vw, 18px);
      margin-top: 28px;
    }

    .time-box {
      min-height: 142px;
      display: grid;
      place-items: center;
      padding: 22px 12px;
      border-radius: 26px;
      background:
        radial-gradient(circle at top, rgba(255, 228, 173, 0.2), transparent 55%),
        rgba(18, 28, 16, 0.48);
      border: 1px solid rgba(246, 237, 218, 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.13);
    }

    .number {
      display: block;
      font-family: "Trebuchet MS", Verdana, sans-serif;
      font-size: clamp(38px, 7vw, 76px);
      font-weight: 900;
      line-height: 1;
      color: #ffd891;
      text-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
    }

    .label {
      display: block;
      margin-top: 12px;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(246, 237, 218, 0.76);
    }

    .date {
      margin-top: 34px;
      font-family: "Trebuchet MS", Verdana, sans-serif;
      font-size: 15px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(246, 237, 218, 0.78);
    }

    .finished {
      display: none;
      margin-top: 34px;
      padding: 24px;
      border-radius: 24px;
      background: rgba(197, 111, 57, 0.28);
      color: #fff4d6;
      font-size: clamp(26px, 5vw, 48px);
      font-weight: 800;
    }

    .share-note {
      margin-top: 28px;
      color: rgba(246, 237, 218, 0.72);
      font-size: 14px;
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(28px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 700px) {
      main {
        padding: 18px;
      }

      .card {
        border-radius: 26px;
      }

      .countdown {
        grid-template-columns: repeat(2, 1fr);
      }

      .time-box {
        min-height: 116px;
        border-radius: 20px;
      }
    }

    @media (max-width: 380px) {
      .countdown {
        gap: 8px;
      }

      .time-box {
        padding: 18px 8px;
      }
    }
  </style>
</head>

<body>
  <div class="background" id="background"></div>
  <div class="grain"></div>

  <main>
    <section class="card">
      <div class="eyebrow">Leśna wyprawa</div>

      <h1>Grzybobranie</h1>

      <p class="subtitle">
        Odliczamy do porannego wyjścia do lasu. Koszyki gotowe, nożyki spakowane,
        livko się chłodzi :D.
      </p>

      <div class="countdown" id="countdown">
        <div class="time-box">
          <div>
            <span class="number" id="days">0</span>
            <span class="label">dni</span>
          </div>
        </div>

        <div class="time-box">
          <div>
            <span class="number" id="hours">0</span>
            <span class="label">godzin</span>
          </div>
        </div>

        <div class="time-box">
          <div>
            <span class="number" id="minutes">0</span>
            <span class="label">minut</span>
          </div>
        </div>

        <div class="time-box">
          <div>
            <span class="number" id="seconds">0</span>
            <span class="label">sekund</span>
          </div>
        </div>
      </div>

      <div class="finished" id="finished">
        Czas ruszać do lasu!
      </div>

      <div class="date" id="eventDateLabel"></div>

      <div class="share-note">
              </div>
    </section>
  </main>

  <script>
    const background = document.getElementById("background");

const forestPhotos = [
  "https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1800&q=85",
  "https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=1800&q=85",
  "https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1800&q=85",
  "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1800&q=85",
  "https://images.unsplash.com/photo-1425913397330-cf8af2ff40a1?auto=format&fit=crop&w=1800&q=85",
  "https://images.unsplash.com/photo-1503435980610-a51f3ddfee50?auto=format&fit=crop&w=1800&q=85",
  "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1800&q=85"
];

function setRandomBackground() {
  const photo = forestPhotos[Math.floor(Math.random() * forestPhotos.length)];
  background.style.backgroundImage = `url("${photo}")`;





    }

    const eventDate = new Date(2026, 8, 20, 8, 0, 0);

    document.getElementById("eventDateLabel").textContent =
      eventDate.toLocaleString("pl-PL", {
        day: "numeric",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = eventDate.getTime() - now;

      if (distance <= 0) {
        document.getElementById("countdown").style.display = "none";
        document.getElementById("finished").style.display = "block";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((distance / (1000 * 60)) % 60);
      const seconds = Math.floor((distance / 1000) % 60);

      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = hours;
      document.getElementById("minutes").textContent = minutes;
      document.getElementById("seconds").textContent = seconds;
    }

    setRandomBackground();
    updateCountdown();

    setInterval(updateCountdown, 1000);
    setInterval(setRandomBackground, 9000);
  </script>
</body>
</html>
